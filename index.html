<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بطاقات تهنئة شركة نبني</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

:root{
--bg:#0f1512;
--card:#16201b;
--gold:#d6b26d;
--goldLight:#f2dfb8;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Cairo;
background:
radial-gradient(circle at top,#1f2b25 0%,#0f1512 70%);
min-height:100vh;
padding:20px;
overflow-x:hidden;
color:white;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:42px 42px;
pointer-events:none;
}

header{
text-align:center;
margin-bottom:28px;
}

header h1{
font-size:clamp(32px,5vw,58px);
font-weight:900;
background:linear-gradient(to right,var(--goldLight),var(--gold));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:8px;
}

header p{
color:#d7d7d7;
font-size:14px;
}

/* ===== Layout ===== */

.layout{
display:grid;
grid-template-columns:380px 1fr;
gap:28px;
max-width:1500px;
margin:auto;
align-items:start;
}

/* ===== Panel ===== */

.panel{
background:rgba(22,32,27,.95);
border:1px solid rgba(255,255,255,.06);
border-radius:30px;
padding:22px;
backdrop-filter:blur(18px);
position:sticky;
top:20px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.sectionTitle{
font-size:22px;
font-weight:800;
margin-bottom:20px;
display:flex;
align-items:center;
gap:10px;
}

.sectionTitle::before{
content:"";
width:10px;
height:10px;
border-radius:50%;
background:var(--gold);
box-shadow:0 0 15px var(--gold);
}

label{
display:block;
margin-bottom:8px;
font-size:13px;
font-weight:700;
color:#ddd;
}

input[type="text"],
select{
width:100%;
padding:14px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
font-family:Cairo;
outline:none;
margin-bottom:18px;
transition:.25s;
}

input[type="text"]:focus,
select:focus{
border-color:var(--gold);
box-shadow:0 0 0 4px rgba(214,178,109,.12);
}

select option{
background:#16201b;
}

.rangeWrap{
background:rgba(255,255,255,.04);
padding:14px;
border-radius:16px;
margin-bottom:18px;
}

.rangeTop{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:13px;
}

input[type="range"]{
width:100%;
appearance:none;
height:6px;
border-radius:10px;
background:rgba(255,255,255,.15);
}

input[type="range"]::-webkit-slider-thumb{
appearance:none;
width:20px;
height:20px;
border-radius:50%;
background:linear-gradient(to bottom,var(--goldLight),var(--gold));
border:3px solid white;
cursor:pointer;
}

.colorRow{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

input[type="color"]{
width:55px;
height:55px;
border:none;
border-radius:14px;
background:none;
overflow:hidden;
cursor:pointer;
}

.boldRow{
display:flex;
align-items:center;
gap:12px;
margin-bottom:20px;
}

.boldBtn{
width:52px;
height:52px;
border-radius:14px;
background:rgba(255,255,255,.05);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:900;
cursor:pointer;
border:1px solid rgba(255,255,255,.08);
transition:.25s;
}

.boldBtn.active{
background:linear-gradient(to bottom,var(--goldLight),var(--gold));
color:#111;
}

/* ===== Templates ===== */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-bottom:22px;
}

.grid img{
width:100%;
aspect-ratio:9/16;
object-fit:cover;
border-radius:18px;
cursor:pointer;
border:2px solid transparent;
transition:.25s;
background:#111;
}

.grid img:hover{
transform:translateY(-4px);
}

.grid img.active{
border-color:var(--gold);
box-shadow:0 0 0 4px rgba(214,178,109,.15);
}

/* ===== Button ===== */

.downloadBtn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(to right,var(--goldLight),var(--gold));
font-family:Cairo;
font-size:16px;
font-weight:900;
cursor:pointer;
color:#111;
transition:.25s;
}

.downloadBtn:hover{
transform:translateY(-2px);
}

/* ===== Preview ===== */

.previewArea{
display:flex;
justify-content:center;
align-items:flex-start;
width:100%;
}

.previewShell{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
padding:18px;
border-radius:32px;
width:100%;
display:flex;
justify-content:center;
overflow:hidden;
backdrop-filter:blur(16px);
}

.previewScale{
width:100%;
display:flex;
justify-content:center;
overflow:auto;
padding:10px;
}

.preview{
position:relative;
width:380px;
aspect-ratio:9/16;
background:#000;
border-radius:28px;
overflow:hidden;
flex-shrink:0;
box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.preview::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to top,
rgba(0,0,0,.35),
rgba(0,0,0,.02)
);
pointer-events:none;
}

.nameText{
position:absolute;
left:50%;
bottom:110px;
transform:translateX(-50%);
font-size:42px;
font-weight:700;
color:white;
text-shadow:
0 4px 15px rgba(0,0,0,.8);
z-index:5;
cursor:move;
user-select:none;
white-space:nowrap;
padding:8px 14px;
border-radius:12px;
touch-action:none;
}

.nameText.drag{
background:rgba(0,0,0,.25);
outline:2px dashed rgba(255,255,255,.7);
}

/* ===== Responsive ===== */

@media(max-width:1200px){

.layout{
grid-template-columns:320px 1fr;
}

.preview{
width:340px;
}

}

@media(max-width:900px){

.layout{
display:flex;
flex-direction:column-reverse;
align-items:center;
gap:22px;
}

.panel{
width:100%;
max-width:700px;
position:relative;
top:auto;
}

.preview{
width:360px;
}

.grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:600px){

body{
padding:12px;
}

.layout{
gap:18px;
}

.panel{
padding:18px;
border-radius:22px;
}

.previewShell{
padding:12px;
border-radius:22px;
}

.preview{
width:100%;
max-width:340px;
border-radius:24px;
}

.nameText{
font-size:30px;
bottom:85px;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.downloadBtn{
padding:14px;
font-size:15px;
}

}

@media(max-width:420px){

.preview{
max-width:300px;
}

.nameText{
font-size:26px;
}

}

</style>

</head>

<body>

<header>

<h1>بطاقات التهنئة</h1>

<p>
تصميم متوافق مع الجوال والكمبيوتر
</p>

</header>

<div class="layout">

<!-- ===== SETTINGS ===== -->

<div class="panel">

<div class="sectionTitle">
الإعدادات
</div>

<label>المناسبة</label>

<select id="occasionSelect"></select>

<label>القوالب</label>

<div class="grid" id="grid"></div>

<label>اسم الموظف</label>

<input type="text" id="empName" placeholder="اكتب اسم الموظف">

<label>نوع الخط</label>

<select id="fontSelect">
<option value="Cairo">Cairo</option>
<option value="Tajawal">Tajawal</option>
<option value="Amiri">Amiri</option>
</select>

<div class="rangeWrap">

<div class="rangeTop">

<span>حجم الخط</span>

<span id="sizeValue">42px</span>

</div>

<input type="range" id="fontSize" min="20" max="80" value="42">

</div>

<div class="colorRow">

<div>

<label>لون الخط</label>

<input type="color" id="fontColor" value="#ffffff">

</div>

</div>

<div class="boldRow">

<div id="boldBtn" class="boldBtn">
B
</div>

<span>خط عريض</span>

</div>

<button class="downloadBtn" onclick="downloadCard()">

تحميل البطاقة

</button>

</div>

<!-- ===== PREVIEW ===== -->

<div class="previewArea">

<div class="previewShell">

<div class="previewScale">

<div class="preview" id="preview">

<img id="previewImg" crossorigin="anonymous">

<div id="nameText" class="nameText">

اسم الموظف

</div>

</div>

</div>

</div>

</div>

</div>

<script>

/* ===== المناسبات ===== */

const occasions = {

"العيد":[
"templates/eid/1.jpg",
"templates/eid/2.jpg",
"templates/eid/3.jpg",
"templates/eid/4.jpg"
],

"رمضان":[
"templates/ramadan/1.jpg",
"templates/ramadan/2.jpg",
"templates/ramadan/3.jpg",
"templates/ramadan/4.jpg"
],

"يوم التأسيس":[
"templates/foundation/1.jpg",
"templates/foundation/2.jpg",
"templates/foundation/3.jpg",
"templates/foundation/4.jpg"
]

}

/* ===== Elements ===== */

const occasionSelect = document.getElementById("occasionSelect")
const grid = document.getElementById("grid")
const previewImg = document.getElementById("previewImg")
const empName = document.getElementById("empName")
const fontSelect = document.getElementById("fontSelect")
const fontSize = document.getElementById("fontSize")
const fontColor = document.getElementById("fontColor")
const nameText = document.getElementById("nameText")
const preview = document.getElementById("preview")
const boldBtn = document.getElementById("boldBtn")
const sizeValue = document.getElementById("sizeValue")

/* ===== المناسبات ===== */

occasionSelect.innerHTML =
Object.keys(occasions)
.map(o=>`<option>${o}</option>`)
.join("")

occasionSelect.onchange = renderTemplates

function renderTemplates(){

grid.innerHTML = ""

occasions[occasionSelect.value].forEach((src,index)=>{

const img = document.createElement("img")

img.src = src + "?v=" + Date.now()

if(index === 0){

previewImg.src = src + "?v=" + Date.now()

img.classList.add("active")

}

img.onclick = ()=>{

previewImg.src = src + "?v=" + Date.now()

document.querySelectorAll(".grid img")
.forEach(i=>i.classList.remove("active"))

img.classList.add("active")

}

grid.appendChild(img)

})

}

renderTemplates()

/* ===== التحكم ===== */

empName.oninput = e=>{

nameText.textContent =
e.target.value || "اسم الموظف"

}

fontSelect.onchange = e=>{

nameText.style.fontFamily = e.target.value

}

fontSize.oninput = e=>{

nameText.style.fontSize =
e.target.value + "px"

sizeValue.textContent =
e.target.value + "px"

}

fontColor.oninput = e=>{

nameText.style.color = e.target.value

}

boldBtn.onclick = ()=>{

boldBtn.classList.toggle("active")

nameText.style.fontWeight =
boldBtn.classList.contains("active")
? 900
: 400

}

/* ===== السحب ===== */

let drag = false
let startX = 0
let startY = 0

function startDrag(x,y){

drag = true

nameText.classList.add("drag")

const rect = nameText.getBoundingClientRect()

startX = x - rect.left
startY = y - rect.top

}

function moveDrag(x,y){

if(!drag) return

const rect = preview.getBoundingClientRect()

let newX =
x - rect.left - startX

let newY =
y - rect.top - startY

nameText.style.left = newX + "px"
nameText.style.top = newY + "px"

nameText.style.bottom = "auto"

nameText.style.transform = "none"

}

function endDrag(){

drag = false

nameText.classList.remove("drag")

}

/* Mouse */

nameText.onmousedown = e=>{

startDrag(e.clientX,e.clientY)

}

window.onmousemove = e=>{

moveDrag(e.clientX,e.clientY)

}

window.onmouseup = endDrag

/* Mobile */

nameText.addEventListener("touchstart",e=>{

const t = e.touches[0]

startDrag(t.clientX,t.clientY)

})

window.addEventListener("touchmove",e=>{

const t = e.touches[0]

moveDrag(t.clientX,t.clientY)

})

window.addEventListener("touchend",endDrag)

window.addEventListener("touchmove",e=>{

if(drag) e.preventDefault()

},{passive:false})

/* ===== تحميل البطاقة ===== */

async function downloadCard(){

if(!previewImg.src){

alert("اختر قالب أولاً")
return

}

try{

await new Promise((resolve,reject)=>{

if(previewImg.complete){

resolve()

}else{

previewImg.onload = resolve
previewImg.onerror = reject

}

})

const canvas = await html2canvas(preview,{

scale:3,
useCORS:true,
allowTaint:true,
backgroundColor:null

})

const link = document.createElement("a")

link.download = "nabni-card.png"

link.href = canvas.toDataURL("image/png",1)

link.click()

}catch(err){

console.log(err)

alert("تعذر تحميل البطاقة، تأكد من الصور")

}

}

</script>

</body>
</html>
